services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      network: host
    network_mode: host
    shm_size: "2gb"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      SEARXNG_URL: http://127.0.0.1:8080
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      OZON_USE_BROWSER: ${OZON_USE_BROWSER:-true}
      OZON_TWO_STAGE_ENABLED: ${OZON_TWO_STAGE_ENABLED:-true}
      OZON_BROAD_SEARCH_MAX: ${OZON_BROAD_SEARCH_MAX:-36}
      OZON_ML_TOP_K: ${OZON_ML_TOP_K:-5}
      OZON_ENRICH_ENABLED: ${OZON_ENRICH_ENABLED:-false}
      OZON_ENRICH_DELAY_SECONDS: ${OZON_ENRICH_DELAY_SECONDS:-12}
      OZON_ENRICH_WAIT_SECONDS: ${OZON_ENRICH_WAIT_SECONDS:-15}
      OZON_PIPELINE_TIMEOUT_SECONDS: ${OZON_PIPELINE_TIMEOUT_SECONDS:-180}
      OZON_BROWSER_CACHE_ENABLED: ${OZON_BROWSER_CACHE_ENABLED:-false}
      OZON_BROWSER_WAIT_SECONDS: ${OZON_BROWSER_WAIT_SECONDS:-30}
      OZON_BROWSER_TOTAL_TIMEOUT_SECONDS: ${OZON_BROWSER_TOTAL_TIMEOUT_SECONDS:-45}
      OZON_BROWSER_WARMUP_HOME: ${OZON_BROWSER_WARMUP_HOME:-true}
      OZON_BROWSER_MAX_RETRIES: ${OZON_BROWSER_MAX_RETRIES:-1}
      OZON_BROWSER_HEADLESS: ${OZON_BROWSER_HEADLESS:-false}
      OZON_DISK_CACHE_DIR: /app/data/ozon_disk_cache
      DISPLAY: ${DISPLAY:-:99}
      XAUTHORITY: ${XAUTHORITY:-}
    volumes:
      - ozon_disk_cache:/app/data/ozon_disk_cache
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    depends_on:
      - redis
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      network: host
    network_mode: host
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 6379
    volumes:
      - redis_data:/data

  searxng:
    image: searxng/searxng:latest
    network_mode: host
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  meilisearch:
    image: getmeili/meilisearch:latest
    network_mode: host
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    command: meilisearch --http-addr 127.0.0.1:7700
    volumes:
      - meili_data:/meili_data

volumes:
  redis_data:
  meili_data:
  ozon_disk_cache:
