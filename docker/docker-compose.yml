services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      network: host
    network_mode: host
    # Host networking avoids broken Docker port publishing with some VPN/tun setups
    # (TCP connects but responses never return through the userland proxy).
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      REDIS_URL: redis://127.0.0.1:6379/0
      SEARXNG_URL: http://127.0.0.1:8080
      MEILI_URL: http://127.0.0.1:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
      OZON_USE_BROWSER: ${OZON_USE_BROWSER:-true}
      OZON_BROWSER_CACHE_ENABLED: ${OZON_BROWSER_CACHE_ENABLED:-false}
      OZON_BROWSER_WAIT_SECONDS: ${OZON_BROWSER_WAIT_SECONDS:-35}
      OZON_BROWSER_MAX_RETRIES: ${OZON_BROWSER_MAX_RETRIES:-2}
      OZON_DISK_CACHE_DIR: /app/data/ozon_disk_cache
      DISPLAY: ":99"
    volumes:
      - ozon_disk_cache:/app/data/ozon_disk_cache
    depends_on:
      - redis
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      network: host
    network_mode: host
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 6379
    volumes:
      - redis_data:/data

  searxng:
    image: searxng/searxng:latest
    network_mode: host
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  meilisearch:
    image: getmeili/meilisearch:latest
    network_mode: host
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    command: meilisearch --http-addr 127.0.0.1:7700
    volumes:
      - meili_data:/meili_data

volumes:
  redis_data:
  meili_data:
  ozon_disk_cache:
