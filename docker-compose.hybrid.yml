# Demo stand: frontend + infra in Docker, FastAPI runs on host (see start_demo.sh).
# nginx proxies /api/ → http://127.0.0.1:8000

services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      network: host
    network_mode: host
    depends_on:
      - redis
      - searxng
      - meilisearch

  redis:
    image: redis:7-alpine
    network_mode: host
    command: redis-server --port 6379
    volumes:
      - redis_data:/data

  searxng:
    image: searxng/searxng:latest
    network_mode: host
    volumes:
      - ./docker/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/

  meilisearch:
    image: getmeili/meilisearch:latest
    network_mode: host
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-master-key}
    command: meilisearch --http-addr 127.0.0.1:7700
    volumes:
      - meili_data:/meili_data

volumes:
  redis_data:
  meili_data:
